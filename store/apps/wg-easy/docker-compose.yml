services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
      net.ipv4.conf.all.src_valid_mark: '1'
    environment:
      PORT: '51821'
      HOST: 0.0.0.0
      # The container sees plain HTTP; Caddy serves the page over HTTPS.
      INSECURE: 'true'
    volumes:
      - ${HLABS_APP_DATA}/wireguard:/etc/wireguard
