services:
  planka:
    image: ghcr.io/plankanban/planka:2.3.1@sha256:f767ab97b878265ea1fff826867718d6ffa95dac04cd979fb5db82489806fb51
    # Planka stops if its database isn't there yet, which happens on a restart; wait for it first.
    command:
      - sh
      - -c
      - until node -e "require('net').connect(5432, 'planka-db').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"; do sleep 1; done; exec ./start.sh
    environment:
      BASE_URL: ${HLABS_URL}
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://planka:${DB_PASSWORD}@planka-db/planka
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_ADMIN_EMAIL: ${ADMIN_EMAIL}
      DEFAULT_ADMIN_NAME: ${ADMIN_NAME}
      DEFAULT_ADMIN_USERNAME: ${ADMIN_USERNAME}
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/data:/app/data
    depends_on:
      planka-db:
        condition: service_healthy
  planka-db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: planka
    volumes:
      - ${HLABS_APP_DATA}/postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, so it passes only once the real server is up (not during first-start setup).
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U planka -d planka']
      interval: 5s
      timeout: 5s
      retries: 30
