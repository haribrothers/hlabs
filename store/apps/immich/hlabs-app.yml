schema: 1
id: immich
name: Immich
version: '3.2.2'
revision: 1
tagline: Back up every photo from your phone
description: |
  Self-hosted photo and video backup with albums, sharing, faces and search. The phone apps back up
  your camera roll automatically.
category: photos
developer: { name: Immich, url: https://immich.app }
source: https://github.com/immich-app/immich
license: AGPL-3.0
icon:
  logo: logo.svg
  gradient: ['#fb923c', '#c2410c']
  fallback: images
platforms: [linux/amd64, linux/arm64]
tags: [local-ai]
requirements: { memory: 4096, disk: 10240 }
web: { service: immich-server, port: 2283, embed: true }
health: { service: immich-server, http: /api/server/ping, timeout: 180 }
env:
  - key: DB_PASSWORD
    type: secret
    generate: true
    hidden: true
folders:
  - key: library
    label: Photo library
    description: Where your photos and videos are stored
    target: /data
    default: home:Photos
    mode: rw
    required: true
ownLogin: true
backup:
  pause: [immich-server, immich-machine-learning]
  exclude: [thumbs/, encoded-video/]
  beforeUpdate: true
permissions: { network: internet }
