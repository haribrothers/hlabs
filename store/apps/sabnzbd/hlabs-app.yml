# A first start writes a starting configuration (its address, so SABnzbd accepts it, and downloads in
# /downloads); SABnzbd fills in the rest. An existing file is left alone.
schema: 1
id: sabnzbd
name: SABnzbd
version: '5.1.3'
revision: 1
tagline: Download from Usenet into your Downloads folder
description: |
  Add an .nzb file and SABnzbd downloads, checks, repairs and unpacks it into Shared/Downloads. You need
  a Usenet provider; the first visit asks for its details. Sonarr, Radarr and Lidarr can send it
  downloads at http://sabnzbd:8080 with its API key.
category: media
developer: { name: SABnzbd, url: https://sabnzbd.org }
source: https://github.com/sabnzbd/sabnzbd
license: GPL-2.0
icon:
  logo: logo.svg
  gradient: ['#f5c518', '#7a5c00']
  fallback: download
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 512, disk: 512 }
web: { service: sabnzbd, port: 8080, embed: true }
folders:
  - key: downloads
    label: Downloads
    description: Where downloads land; the same folder in every download app
    target: /downloads
    default: shared:Downloads
    mode: rw
    required: true
ownLogin: false
backup:
  pause: [sabnzbd]
  exclude: [logs/]
  beforeUpdate: true
permissions: { network: internet }
