services:
  grafana:
    image: docker.io/grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    user: ${PUID}:${PGID}
    environment:
      GF_SERVER_ROOT_URL: ${HLABS_URL}
      # No usage reports or update checks.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ${HLABS_APP_DATA}/data:/var/lib/grafana
