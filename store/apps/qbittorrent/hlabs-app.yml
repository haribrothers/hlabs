# A first start writes a starting configuration (downloads in /downloads, no qBittorrent password for
# requests from hlabs and other apps on private addresses); an existing file is left alone.
schema: 1
id: qbittorrent
name: qBittorrent
version: '5.3.0'
revision: 1
tagline: Download torrents into your Downloads folder
description: |
  A full torrent client in the browser: add a magnet link or a .torrent file and it downloads into
  Shared/Downloads. Sonarr, Radarr and Lidarr can send it downloads at http://qbittorrent:8080 with no
  password (the hlabs login protects it). It works without opening a port on your router.
category: media
developer: { name: qBittorrent, url: https://www.qbittorrent.org }
source: https://github.com/qbittorrent/qBittorrent
license: GPL-2.0
icon:
  logo: logo.svg
  gradient: ['#2f67ba', '#0f2a52']
  fallback: download
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 512, disk: 512 }
web: { service: qbittorrent, port: 8080, embed: true }
folders:
  - key: downloads
    label: Downloads
    description: Where downloads land; the same folder in every download app
    target: /downloads
    default: shared:Downloads
    mode: rw
    required: true
ownLogin: false
backup:
  pause: [qbittorrent]
  beforeUpdate: true
permissions: { network: internet }
