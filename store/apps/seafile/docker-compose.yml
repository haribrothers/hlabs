services:
  seafile:
    image: docker.io/seafileltd/seafile-mc:13.0.30@sha256:92df4680b5cbf2cdb0c7257942a9bea42b1c297aad9eab6bbd017e53f1ccfc2f
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: '3306'
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${DB_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: ${TZ}
      INIT_SEAFILE_ADMIN_EMAIL: ${ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: ${HLABS_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: https
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: 'true'
      ENABLE_SEADOC: 'false'
      ENABLE_NOTIFICATION_SERVER: 'false'
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/seafile:/shared
    depends_on:
      seafile-db:
        condition: service_healthy
  seafile-db:
    image: docker.io/library/mariadb:10.11.19@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: 'true'
      MARIADB_AUTO_UPGRADE: '1'
    volumes:
      - ${HLABS_APP_DATA}/mariadb:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --mariadbupgrade, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 30
  seafile-redis:
    image: docker.io/library/redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
