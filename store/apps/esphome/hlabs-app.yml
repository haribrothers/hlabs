schema: 1
id: esphome
name: ESPHome
version: '2026.11.1'
revision: 1
tagline: Make your own smart-home devices with ESP boards
description: |
  Write a short configuration and ESPHome turns a cheap ESP32 or ESP8266 board into a sensor, switch or
  light for Home Assistant. Install the first firmware from the browser over USB; later updates go over
  Wi-Fi. It has no login of its own: the hlabs login protects it.
category: home
developer: { name: ESPHome, url: https://esphome.io }
source: https://github.com/esphome/esphome
license: GPL-3.0
icon:
  logo: logo.svg
  gradient: ['#18bcf2', '#063c4d']
  fallback: cpu
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 1024, disk: 2048 }
web: { service: esphome, port: 6052, embed: true }
ownLogin: false
backup:
  pause: [esphome]
  exclude: [.esphome/build/]
  beforeUpdate: true
permissions: { network: internet }
