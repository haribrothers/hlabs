schema: 1
id: code-server
name: code-server
version: '4.146.0'
revision: 1
tagline: VS Code in your browser
description: |
  A full Visual Studio Code in the browser, with a terminal, extensions and your projects folder, on any
  device. It has no login of its own: the hlabs login protects it. Its terminal can change anything in
  its folders.
category: developer
developer: { name: Coder, url: https://coder.com }
source: https://github.com/coder/code-server
license: MIT
icon:
  logo: logo.png
  gradient: ['#007acc', '#00365c']
  fallback: code
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 1024, disk: 2048 }
web: { service: code-server, port: 8443, embed: true }
folders:
  - key: projects
    label: Projects
    description: Your code
    target: /config/workspace
    default: home:Code
    mode: rw
    required: true
ownLogin: false
backup:
  pause: [code-server]
  beforeUpdate: true
permissions: { network: internet }
