services:
  archivebox:
    image: docker.io/archivebox/archivebox:0.9.77@sha256:f63170551ec48d7aa087c71e2d093156dbf4b4ed8680e2f97f22483e3bc71e55
    command: server --quick-init 0.0.0.0:8000
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_HOSTS: '*'
      CSRF_TRUSTED_ORIGINS: ${HLABS_URL}
      PUBLIC_INDEX: 'False'
      PUBLIC_SNAPSHOTS: 'False'
      PUBLIC_ADD_VIEW: 'False'
    volumes:
      - ${HLABS_APP_DATA}/data:/data
