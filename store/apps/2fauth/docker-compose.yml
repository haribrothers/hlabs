services:
  2fauth:
    image: docker.io/2fauth/2fauth:9.0.3@sha256:fb421b40072f9b1412fa954798bc2e2acb755dd312ce6b21c1d004ce15c2a562
    # The image's files are its own user's only (uid 1000), so it can't run as hlabs's user: it starts as root, hands
    # the data folder hlabs made to uid 1000 (Linux), and runs as that user, named for su.
    user: '0:0'
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown 1000:1000 /2fauth
        grep -q '^twofauth:' /etc/passwd || echo 'twofauth:x:1000:1000::/srv:/bin/sh' >> /etc/passwd
        exec su -p -s /bin/sh twofauth -c '
          [ -f /2fauth/app-key ] || head -c 16 /dev/urandom | od -An -tx1 | tr -d " \n" > /2fauth/app-key
          export APP_KEY="$$(cat /2fauth/app-key)"
          exec /usr/local/bin/entrypoint.sh'
    environment:
      APP_URL: ${HLABS_URL}
      TRUSTED_PROXIES: '*'
    volumes:
      - ${HLABS_APP_DATA}/data:/2fauth
