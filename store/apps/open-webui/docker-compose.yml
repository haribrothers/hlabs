services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.5@sha256:e0dc5a8bf5c71cadf339d1e7b9408b357da75fb2854f82cad57a1609fadf2a22
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_URL: ${HLABS_URL}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HLABS_APP_DATA}/data:/app/backend/data
