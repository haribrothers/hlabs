services:
  copyparty:
    image: docker.io/copyparty/ac:1.20.28@sha256:75c58da287339fc4fd93974b4f19b72a2e7efe5431edf405b4b3295f0662a711
    user: ${PUID}:${PGID}
    # Without a config file of its own, copyparty in Docker turns reading off as a failsafe. A first start writes
    # one that shares the folder with everyone who gets past the hlabs login; an existing file is left alone.
    entrypoint:
      - /bin/ash
      - -c
      - |
        [ -f /cfg/hlabs.conf ] || printf '%s\n' '[/]' '  /w' '  accs:' '    rwmd: *' > /cfg/hlabs.conf
        exec /bin/ash /z/cpp.sh -c /z/initcfg
    volumes:
      - ${HLABS_APP_DATA}/cfg:/cfg
      - ${HLABS_FOLDER_FILES}:/w
