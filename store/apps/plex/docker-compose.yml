services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5@sha256:9a1325bf0b34a50993a04be0bdcc7fab841d2a78161bd11b4db4ff8478a7ac2a
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}
    volumes:
      - ${HLABS_APP_DATA}/config:/config
      - ${HLABS_APP_DATA}/transcode:/transcode
      - ${HLABS_FOLDER_MEDIA}:/media
