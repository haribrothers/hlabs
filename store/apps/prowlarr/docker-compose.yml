services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.1.0@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
      PROWLARR__LOG__ANALYTICSENABLED: 'False'
    volumes:
      - ${HLABS_APP_DATA}/config:/config
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      LOG_LEVEL: info
