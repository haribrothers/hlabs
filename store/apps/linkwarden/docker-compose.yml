services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
    environment:
      DATABASE_URL: postgresql://linkwarden:${DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${HLABS_URL}/api/v1/auth
    volumes:
      - ${HLABS_APP_DATA}/data:/data/data
    depends_on:
      linkwarden-db:
        condition: service_healthy
  linkwarden-db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: linkwarden
    volumes:
      - ${HLABS_APP_DATA}/postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, so it passes only once the real server is up (not during first-start setup).
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U linkwarden -d linkwarden']
      interval: 5s
      timeout: 5s
      retries: 30
