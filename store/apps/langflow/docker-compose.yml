services:
  langflow:
    image: docker.io/langflowai/langflow:1.13.3@sha256:0dea79f5a557e1602b5514973484332f479cdb6b71cceb098536ecc231b02d7d
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:${DB_PASSWORD}@langflow-db:5432/langflow
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_AUTO_LOGIN: 'true'
      # No usage reports.
      DO_NOT_TRACK: 'true'
      LANGFLOW_DO_NOT_TRACK: 'true'
    volumes:
      - ${HLABS_APP_DATA}/config:/app/langflow
    depends_on:
      langflow-db:
        condition: service_healthy
  langflow-db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: langflow
    volumes:
      - ${HLABS_APP_DATA}/postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, so it passes only once the real server is up (not during first-start setup).
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U langflow -d langflow']
      interval: 5s
      timeout: 5s
      retries: 30
