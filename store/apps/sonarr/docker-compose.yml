services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__LOG__ANALYTICSENABLED: 'False'
    volumes:
      - ${HLABS_APP_DATA}/config:/config
      - ${HLABS_FOLDER_TV}:/tv
      - ${HLABS_FOLDER_DOWNLOADS}:/downloads
