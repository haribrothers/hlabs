# Sonarr's own login is replaced by the hlabs login (SONARR__AUTH__METHOD=External), as AdGuard Home's is (D-085);
# its usage reporting is off.
schema: 1
id: sonarr
name: Sonarr
version: '4.0.20'
revision: 1
tagline: Finds and downloads new episodes of your TV shows
description: |
  Follow your TV shows and Sonarr finds each new episode, sends it to your download app and files it
  in your TV folder with the right name, ready for Jellyfin or Plex.
  Its own login is turned off (the hlabs login protects it). Other apps reach it at http://sonarr:8989; it reaches your download apps the same way, e.g. http://qbittorrent:8080.
category: media
developer: { name: Sonarr, url: https://sonarr.tv }
source: https://github.com/Sonarr/Sonarr
license: GPL-3.0
icon:
  logo: logo.svg
  gradient: ['#35c5f4', '#0b4f6c']
  fallback: tv
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 512, disk: 1024 }
web: { service: sonarr, port: 8989, embed: true }
health: { service: sonarr, http: /ping, timeout: 180 }
folders:
  - key: tv
    label: TV shows
    description: Your TV library
    target: /tv
    default: shared:Media/TV
    mode: rw
    required: true
  - key: downloads
    label: Downloads
    description: Where downloads land; the same folder in every download app
    target: /downloads
    default: shared:Downloads
    mode: rw
    required: true
ownLogin: false
backup:
  pause: [sonarr]
  exclude: [logs/, MediaCover/]
  beforeUpdate: true
permissions: { network: internet }
