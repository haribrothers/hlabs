# n8n runs as the hlabs user (so its data folder is writable on Linux), which has no home directory in the
# image: N8N_USER_FOLDER says where its .n8n folder is, and its cache gets a folder of its own.
services:
  n8n:
    image: docker.io/n8nio/n8n:2.41.3@sha256:fdce8f852ac7abbb2f31a53170bc3c2eeec45c37c0692a99f2d6c11b3822cd98
    user: ${PUID}:${PGID}
    environment:
      N8N_HOST: ${HLABS_HOSTNAME}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: ${HLABS_URL}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      N8N_USER_FOLDER: /home/node
    volumes:
      - ${HLABS_APP_DATA}/data:/home/node/.n8n
      - ${HLABS_APP_DATA}/cache:/home/node/.cache
