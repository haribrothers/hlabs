services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
    user: ${PUID}:${PGID}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cd /data
        printf '%s\n' '<library version="20110515"></library>' > library.xml
        for z in *.zim; do [ -f "$$z" ] && kiwix-manage library.xml add "$$z"; done
        exec kiwix-serve --port=8080 --library --monitorLibrary library.xml
    volumes:
      - ${HLABS_FOLDER_CONTENT}:/data
