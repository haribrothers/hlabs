# A first start turns off Bazarr's usage reporting; Bazarr fills in the rest. An existing file is left alone.
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /config/config
        [ -f /config/config/config.yaml ] || printf '%s\n' 'analytics:' '  enabled: false' > /config/config/config.yaml
        exec /init
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${HLABS_APP_DATA}/config:/config
      - ${HLABS_FOLDER_TV}:/tv
      - ${HLABS_FOLDER_MOVIES}:/movies
