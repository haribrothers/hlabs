schema: 1
id: deluge
name: Deluge
version: '18.04.1'
revision: 1
tagline: A torrent client you can extend with plugins
description: |
  Add a magnet link or a .torrent file and Deluge downloads it into Shared/Downloads, with plugins for
  labels, schedules and more. Its first password is deluge: change it in Preferences › Interface.
  Sonarr, Radarr and Lidarr can send it downloads at http://deluge:8112.
category: media
developer: { name: Deluge, url: https://deluge-torrent.org }
source: https://github.com/deluge-torrent/deluge
license: GPL-3.0
icon:
  logo: logo.svg
  gradient: ['#4c84c6', '#1b3a5e']
  fallback: download
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 256, disk: 256 }
web: { service: deluge, port: 8112, embed: true }
folders:
  - key: downloads
    label: Downloads
    description: Where downloads land; the same folder in every download app
    target: /downloads
    default: shared:Downloads
    mode: rw
    required: true
ownLogin: true
backup:
  pause: [deluge]
  beforeUpdate: true
permissions: { network: internet }
