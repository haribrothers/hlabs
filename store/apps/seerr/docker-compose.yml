services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    # As hlabs's user: the image's own (uid 1000) can't write a data folder hlabs made on Linux.
    user: ${PUID}:${PGID}
    init: true
    environment:
      LOG_LEVEL: info
    volumes:
      - ${HLABS_APP_DATA}/config:/app/config
