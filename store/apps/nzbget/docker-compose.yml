services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:2021.11.25@sha256:2f12cb315ad9c87429c1416cbe9e06ac5c207f9a69cec2bb6e654c5359ae05d2
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      NZBGET_USER: nzbget
      NZBGET_PASS: ${UI_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/config:/config
      - ${HLABS_FOLDER_DOWNLOADS}:/downloads
