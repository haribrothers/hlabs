schema: 1
id: trilium
name: Trilium Notes
version: '0.107.0'
revision: 1
tagline: Build your own knowledge base of linked notes
description: |
  Organise notes in a tree, link them together, and add pictures, code, tables and diagrams. Notes can
  be encrypted and kept in sync with the desktop app. The first visit asks you to set a password.
category: productivity
developer: { name: TriliumNext, url: https://triliumnotes.org }
source: https://github.com/TriliumNext/Trilium
license: AGPL-3.0
icon:
  logo: logo.svg
  gradient: ['#6b7280', '#1f2937']
  fallback: network
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 512, disk: 1024 }
web: { service: trilium, port: 8080, embed: true }
health: { service: trilium, http: /api/health-check, timeout: 120 }
ownLogin: true
backup:
  pause: [trilium]
  exclude: [log/, backup/]
  beforeUpdate: true
permissions: { network: internet }
