services:
  transmission:
    image: lscr.io/linuxserver/transmission:2021.11.18@sha256:9944fcda726c9749914b06268e5435c5ba057191fde0052013c8f84c303763a4
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      # Transmission answers only the addresses it's told about.
      HOST_WHITELIST: ${HLABS_HOSTNAME},transmission
    volumes:
      - ${HLABS_APP_DATA}/config:/config
      - ${HLABS_FOLDER_DOWNLOADS}:/downloads
