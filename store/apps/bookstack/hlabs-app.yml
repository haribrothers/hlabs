# A first start makes BookStack's encryption key (APP_KEY) and keeps it in the app's data; an existing
# one is left alone.
schema: 1
id: bookstack
name: BookStack
version: '26.09.20260929'
revision: 1
tagline: A simple wiki organised like books on a shelf
description: |
  Write documentation and how-tos in shelves, books, chapters and pages, with a friendly editor,
  search and page history. Sign in the first time as admin@admin.com with the password password,
  then change both.
category: productivity
developer: { name: BookStack, url: https://www.bookstackapp.com }
source: https://github.com/BookStackApp/BookStack
license: MIT
icon:
  logo: logo.svg
  gradient: ['#0288d1', '#01395c']
  fallback: book-marked
platforms: [linux/amd64, linux/arm64]
requirements: { memory: 512, disk: 1024 }
web: { service: bookstack, port: 80, embed: true }
env:
  - key: DB_PASSWORD
    type: secret
    generate: true
    hidden: true
  - key: DB_ROOT_PASSWORD
    type: secret
    generate: true
    hidden: true
ownLogin: true
backup:
  pause: [bookstack, bookstack-db]
  exclude: [log/]
  beforeUpdate: true
permissions: { network: internet }
