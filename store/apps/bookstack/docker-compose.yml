services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.3@sha256:5e44313f320a8a6f92f171b1beca4748f3e0a5110a4f4c19047cb4b4e43695a2
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /config/app-key ] || php -r 'echo "base64:".base64_encode(random_bytes(32));' > /config/app-key
        export APP_KEY="$$(cat /config/app-key)"
        exec /init
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      APP_URL: ${HLABS_URL}
      DB_HOST: bookstack-db
      DB_PORT: '3306'
      DB_USERNAME: bookstack
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: bookstack
    volumes:
      - ${HLABS_APP_DATA}/config:/config
    depends_on:
      bookstack-db:
        condition: service_healthy
  bookstack-db:
    image: lscr.io/linuxserver/mariadb:11.4.4@sha256:a14dd69fc199e5cd59e00fb9998dd866fcc73d46c995118c719cd4f5589c370c
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/mariadb:/config
    healthcheck:
      test: [CMD-SHELL, 'mariadb -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 30
