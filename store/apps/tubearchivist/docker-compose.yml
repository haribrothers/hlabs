# From Tube Archivist's own docker-compose.yml: plain Redis (Valkey here) and the official Elasticsearch image.
services:
  tubearchivist:
    image: docker.io/bbilly1/tubearchivist:v0.6.0@sha256:0cbc18aa953c72ec7dfdd6f8fa7c2fe89b5d04489857d7baa354fecbd6181e69
    user: ${PUID}:${PGID}
    environment:
      ES_URL: http://tubearchivist-es:9200
      REDIS_CON: redis://tubearchivist-redis:6379
      TA_HOST: ${HLABS_URL}
      TA_USERNAME: ${TA_USERNAME}
      TA_PASSWORD: ${TA_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ${HLABS_FOLDER_VIDEOS}:/youtube
      - ${HLABS_APP_DATA}/cache:/cache
    # Its own check, from inside: Tube Archivist answers only the host names in TA_HOST (and localhost).
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/health/]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      tubearchivist-es:
        condition: service_healthy
      tubearchivist-redis:
        condition: service_healthy
  tubearchivist-redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    volumes:
      - ${HLABS_APP_DATA}/redis:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  tubearchivist-es:
    image: docker.io/library/elasticsearch:9.5.5@sha256:6f11b295d5099c18b8774d280a82725d1184d0d5cb08373b12785ce7cd7a9bfb
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: 'true'
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    volumes:
      - ${HLABS_APP_DATA}/es:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -fs -u "elastic:$$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"',
        ]
      interval: 10s
      timeout: 10s
      retries: 60
