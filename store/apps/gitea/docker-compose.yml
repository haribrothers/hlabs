# Git over SSH isn't offered (no raw port): clone and push over https at the app's address.
services:
  gitea:
    image: docker.io/gitea/gitea:28.4.0@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${HLABS_HOSTNAME}
      GITEA__server__ROOT_URL: ${HLABS_URL}/
      GITEA__server__DISABLE_SSH: 'true'
    volumes:
      - ${HLABS_APP_DATA}/data:/data
