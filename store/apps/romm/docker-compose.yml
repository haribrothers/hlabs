services:
  romm:
    image: ghcr.io/rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
    environment:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
    volumes:
      - ${HLABS_FOLDER_GAMES}:/romm/library
      - ${HLABS_APP_DATA}/redis:/redis-data
      - ${HLABS_APP_DATA}/resources:/romm/resources
      - ${HLABS_APP_DATA}/config:/romm/config
      - ${HLABS_APP_DATA}/assets:/romm/assets
    depends_on:
      romm-db:
        condition: service_healthy
  # RomM's migrations create triggers, which MariaDB refuses to a normal user while binary logging is on (RomM's
  # docs use the official image, with binary logging off).
  romm-db:
    image: docker.io/library/mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    command: --log-bin-trust-function-creators=1
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/mariadb:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
