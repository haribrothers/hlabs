services:
  nocodb:
    image: docker.io/nocodb/nocodb:2026.10.2@sha256:c8fd5e028cfd3932fefaae775ea25bf1949ea64b8a042e6582892a14bc216fa9
    environment:
      NC_DB: pg://nocodb-db:5432?u=nocodb&p=${DB_PASSWORD}&d=nocodb
      NC_PUBLIC_URL: ${HLABS_URL}
      NC_AUTH_JWT_SECRET: ${JWT_SECRET}
      # No usage reports.
      NC_DISABLE_TELE: 'true'
    volumes:
      - ${HLABS_APP_DATA}/data:/usr/app/data
    depends_on:
      nocodb-db:
        condition: service_healthy
  nocodb-db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nocodb
    volumes:
      - ${HLABS_APP_DATA}/postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, so it passes only once the real server is up (not during first-start setup).
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U nocodb -d nocodb']
      interval: 5s
      timeout: 5s
      retries: 30
