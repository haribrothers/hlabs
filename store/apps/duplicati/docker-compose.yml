services:
  duplicati:
    image: docker.io/duplicati/duplicati:2.4.1.0@sha256:5df64d95abd79ddaa41897a6c234c956d6de03df767a1b8eb8c5baecf3162bbf
    environment:
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      DUPLICATI__WEBSERVICE_PASSWORD: ${UI_PASSWORD}
      # Duplicati answers only the addresses it's told; the hlabs login is in front of it.
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: '*'
      # No usage reports.
      USAGEREPORTER_Duplicati_LEVEL: none
    volumes:
      - ${HLABS_APP_DATA}/data:/data
      - ${HLABS_FOLDER_SOURCE}:/source
      - ${HLABS_FOLDER_BACKUPS}:/backups
