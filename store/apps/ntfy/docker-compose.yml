services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.38.3@sha256:874299b207a9815e7a0cf551b3a094241db7604fa2d274bbd86f569154b6ea51
    command: serve
    environment:
      NTFY_BASE_URL: ${HLABS_URL}
      NTFY_BEHIND_PROXY: 'true'
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ${HLABS_APP_DATA}/cache:/var/cache/ntfy
