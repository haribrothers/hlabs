services:
  booklore:
    image: ghcr.io/booklore-app/booklore:v2.4.0@sha256:f92dae443c38098bf8348742465f6f3b17b619cb8f0e5c2cf195dcdfbb88eaeb
    environment:
      USER_ID: ${PUID}
      GROUP_ID: ${PGID}
      DATABASE_URL: jdbc:mariadb://booklore-db:3306/booklore
      DATABASE_USERNAME: booklore
      DATABASE_PASSWORD: ${DB_PASSWORD}
      SWAGGER_ENABLED: 'false'
    volumes:
      - ${HLABS_APP_DATA}/data:/app/data
      - ${HLABS_APP_DATA}/bookdrop:/bookdrop
      - ${HLABS_FOLDER_BOOKS}:/books
    depends_on:
      booklore-db:
        condition: service_healthy
  booklore-db:
    image: lscr.io/linuxserver/mariadb:11.4.4@sha256:a14dd69fc199e5cd59e00fb9998dd866fcc73d46c995118c719cd4f5589c370c
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: booklore
      MYSQL_USER: booklore
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${HLABS_APP_DATA}/mariadb:/config
    healthcheck:
      # Signs in as the app's user over TCP, which works only once first-start setup has finished.
      test: [CMD-SHELL, 'mariadb -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 30
