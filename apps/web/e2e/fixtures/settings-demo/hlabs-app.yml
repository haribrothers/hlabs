schema: 1
id: settings-demo
name: Settings demo
version: '1.0.0'
revision: 1
tagline: A test app for e2e (US-APP-13…18)
description: |
  A tiny web server with a setting of each kind, so App settings › Configuration and Permissions can be tried for real.
category: developer
developer: { name: hlabs e2e }
icon:
  gradient: ['#38bdf8', '#0369a1']
  fallback: sliders-horizontal
platforms: [linux/amd64, linux/arm64]
web: { service: web, port: 80 }
health: { service: web, http: /, timeout: 30 }
env:
  - key: WORKERS
    label: Workers
    type: number
    default: 2
  - key: API_TOKEN
    type: secret
    generate: true
    hidden: true
  - key: MAIL_PASSWORD
    label: Mail password
    type: secret
    required: false
folders:
  - key: inbox
    label: Inbox
    description: For importing files
    target: /inbox
    mode: rw
    required: false
ownLogin: true
permissions: { network: internet, internetReason: Needed for website icons }
