# A project's own compose file, as many publish one (written for these tests).
services:
  app:
    image: example/notes:2.4.1
    container_name: notes
    restart: always
    ports:
      - '8080:3000'
    environment:
      DATABASE_URL: postgres://notes:notes@db/notes
    volumes:
      - notes-data:/app/data
    depends_on: [db]
  db:
    image: postgres:latest
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  notes-data:
  db:
