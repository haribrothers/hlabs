# Built-in store: validate every app, and the install matrix (D-071, D-100): each app installs, opens at
# https://<app>.hlabs.local, restarts and uninstalls on Linux with the real engine and Caddy (scripts/store-matrix.ts).
# Which apps (US-STORE-26, scripts/store-select.ts): a pull request installs the apps it changes plus the smoke set,
# and 10 apps that change daily when it touches the install path; the nightly run installs every app, five to a
# runner, then reports the install rate and opens an issue for each failing app (scripts/store-report.ts).
# Index signing (06 §Store index) arrives with app sources.
name: store

on:
  pull_request:
    paths:
      - 'store/**'
      - 'packages/app-manifest/**'
      - 'apps/daemon/src/apps/**'
      - 'apps/daemon/src/caddy/**'
      - 'apps/daemon/src/engine/**'
      - 'scripts/store-matrix.ts'
      - 'scripts/store-select*.ts'
      - 'scripts/store-report.ts'
      - '.github/workflows/store.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      apps:
        description: 'App ids to check, comma-separated (empty: every app)'
        required: false

# A newer push makes a running check of an older one pointless.
concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hlabs/icons build
      - run: pnpm store:lint
      - run: pnpm store:build

  apps:
    name: choose apps
    runs-on: ubuntu-latest
    outputs:
      planned: ${{ steps.select.outputs.planned }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.apps }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/store-select.ts pr --base "origin/$BASE" ;;
            workflow_dispatch) node scripts/store-select.ts apps "$WANTED" ;;
            *) node scripts/store-select.ts nightly --per-runner 5 ;;
          esac

  matrix:
    name: install ${{ matrix.shard }}
    needs: [lint, apps]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.apps.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-binaries
      - run: pnpm --filter @hlabs/icons build
      # AdGuard Home serves DNS on port 53, which Ubuntu's resolver stub holds: free it, keeping DNS working.
      - name: Free port 53
        if: contains(format(' {0} ', matrix.shard), ' adguard-home ')
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/no-stub.conf
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          sudo systemctl restart systemd-resolved
      - run: mkdir -p .matrix-results
      - run: node scripts/store-matrix.ts --results .matrix-results/${{ strategy.job-index }}.json --prune-images ${{ matrix.shard }}
      - name: Daemon and Caddy logs
        if: failure()
        run: |
          tail -n 200 .matrix-data/logs/*.log || true
          tail -n 100 .matrix-data/caddy/caddy.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results-${{ strategy.job-index }}
          path: .matrix-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: install rate
    needs: [apps, matrix]
    if: always() && needs.apps.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-results-*
          path: .matrix-results
      - env:
          GH_TOKEN: ${{ github.token }}
          PLANNED: ${{ needs.apps.outputs.planned }}
          ISSUES: ${{ github.event_name == 'schedule' && '--issues' || '' }}
        run: node scripts/store-report.ts --planned "$PLANNED" --results .matrix-results $ISSUES
