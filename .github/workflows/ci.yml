# Lint, typecheck, unit/integration tests, build, store:lint and boundaries on Linux and macOS;
# end-to-end on Linux (docs/prd/11-testing-release.md §CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Caddy and docker-compose, checked against pinned checksums (D-072)
        run: pnpm fetch-binaries
      - name: Lint and dependency boundaries
        run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm store:lint
      - name: Generated design tokens are current
        run: pnpm ui:tokens && git diff --exit-code packages/ui/src

  # One job per Playwright project, side by side: each has its own instances, so the whole suite takes about as long as
  # its longest project instead of all of them in a row.
  e2e:
    name: e2e (Linux, ${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone, first-run, first-run-phone, serial]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-binaries
      - run: pnpm --filter @hlabs/icons build
      - run: pnpm --filter @hlabs/web exec playwright install --with-deps chromium
      - run: pnpm --filter @hlabs/web exec playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'
          HLABS_E2E_SPLIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report
          retention-days: 14

  # The required check: passes only when every e2e project passed.
  e2e-result:
    name: e2e (Linux)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e.result }}" = success
