# Website and help (D-055, D-147): build the site and check the help can't fall behind the product (site:check).
# axe, Lighthouse and the Cloudflare Pages deploy arrive with part (d) of phase 6's website step.
name: site

on:
  pull_request:
    paths:
      - apps/site/**
      - store/**
      - packages/ui/**
      - packages/icons/**
      - .github/workflows/site.yml
      # What site:check compares the help with: help links, error messages, the features list.
      - apps/web/src/**
      - apps/tray/src/**
      - apps/cli/src/**
      - docs/features/**
      - scripts/site-check.ts
  push:
    branches: [main]
    paths: ['apps/site/**', 'store/**', 'packages/ui/**', 'packages/icons/**']

# A newer push makes a running check of an older one pointless.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - name: The help covers the product (US-SITE-07, 09, 10)
        run: pnpm site:check
